[project]
name = "wicket-gate"
version = "0.1.0"
description = "Graded safety checks for LLM agents on edge clusters"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "numpy>=1.26",
  "scipy>=1.11.0",
  "scikit-learn>=1.4.0",
  "joblib>=1.3",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "kubernetes>=30.0.0",
  "mcp>=1.0.0",
  "chromadb>=0.5.0",
]

[project.optional-dependencies]
encoders = ["sentence-transformers>=6.0.1"]  # embedding T0 featurizers

[project.scripts]
wicket-gate = "network_orch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_orch"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 140
extend-exclude = ["evals/kaggle"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
