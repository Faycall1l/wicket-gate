apiVersion: v1
kind: Namespace
metadata: { name: oracle }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: agent, namespace: oracle }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: agent, namespace: oracle }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: agent, namespace: oracle }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: agent }
subjects: [{ kind: ServiceAccount, name: agent, namespace: oracle }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: streamer, namespace: oracle }
spec:
  replicas: 2
  selector: { matchLabels: { app: streamer } }
  template:
    metadata: { labels: { app: streamer } }
    spec:
      nodeSelector: { topology.network-orch/zone: edge-a }
      containers:
        - name: streamer
          image: nginx:1.27-alpine
          readinessProbe: { httpGet: { path: /, port: 80 }, periodSeconds: 2 }
          resources:
            requests: { cpu: "250m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "128Mi" }
