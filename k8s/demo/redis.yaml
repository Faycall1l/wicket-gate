apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-anchor
  namespace: streaming-demo
  labels:
    app: redis-anchor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-anchor
  template:
    metadata:
      labels:
        app: redis-anchor
    spec:
      nodeSelector:
        topology.network-orch/zone: cloud
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-anchor
  namespace: streaming-demo
spec:
  selector: { app: redis-anchor }
  ports:
    - port: 6379
      targetPort: 6379
